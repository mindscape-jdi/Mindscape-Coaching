<g transform="translate(780,430)"><path d="M0,0 L-46,92 L46,92 Z" fill="#23415f"/><line x1="-150" y1="92" x2="150" y2="92" stroke="#5b6777" stroke-width="2" stroke-linecap="round"/><g transform="rotate(0)"><rect x="-315" y="-16" width="630" height="16" rx="5" fill="#3a5f86"/><rect x="-190" y="-46" width="8" height="32" rx="3" fill="#3a5f86"/><rect x="182" y="-46" width="8" height="32" rx="3" fill="#3a5f86"/><rect x="-309" y="-48" width="44" height="32" rx="4" fill="#23415f"/><g fill="#c2410c"><rect x="265" y="-26" width="44" height="10" rx="5"/><rect x="267" y="-37" width="44" height="10" rx="5"/><rect x="264" y="-48" width="44" height="10" rx="5"/></g></g><path d="M-222.0,-82.0 L-186.0,-46.0" stroke="#1b2430" stroke-width="10" stroke-linecap="round"/><path d="M-248.0,-16.0 Q-250.0,-76.0 -232.0,-88.0 L-208.0,-84.0 Q-206.0,-56.0 -210.0,-16.0 Z" fill="#1b2430"/><path d="M-228.0,-22.0 L-184.0,-18.0 L-180.0,30.0" fill="none" stroke="#1b2430" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-219.0" cy="-120.0" r="20" fill="#1b2430"/><circle cx="-209.0" cy="-123.0" r="2.6" fill="#f3f5f7"/><path d="M222.0,-82.0 L186.0,-46.0" stroke="#1b2430" stroke-width="10" stroke-linecap="round"/><path d="M248.0,-16.0 Q250.0,-76.0 232.0,-88.0 L208.0,-84.0 Q206.0,-56.0 210.0,-16.0 Z" fill="#1b2430"/><path d="M228.0,-22.0 L184.0,-18.0 L180.0,30.0" fill="none" stroke="#1b2430" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="219.0" cy="-120.0" r="20" fill="#1b2430"/><circle cx="209.0" cy="-123.0" r="2.6" fill="#f3f5f7"/><line x1="-193.0" y1="-123.0" x2="193.0" y2="-123.0" stroke="#c2410c" stroke-width="2.5"/><path d="M-110.0,-189.0 h96 a10,10 0 0 1 10,10 v20 a10,10 0 0 1 -10,10 H-84.0 l-14.0,16 l2.0,-16 H-110.0 a10,10 0 0 1 -10,-10 v-20 a10,10 0 0 1 10,-10 z" fill="#fde4d4" stroke="#c2410c" stroke-width="2"/><circle cx="-78.0" cy="-169.0" r="3.5" fill="#c2410c"/><circle cx="-62.0" cy="-169.0" r="3.5" fill="#c2410c"/><circle cx="-46.0" cy="-169.0" r="3.5" fill="#c2410c"/><path d="M14.0,-189.0 h96 a10,10 0 0 1 10,10 v20 a10,10 0 0 1 -10,10 H100.0 l14.0,16 l-2.0,-16 H14.0 a10,10 0 0 1 -10,-10 v-20 a10,10 0 0 1 10,-10 z" fill="#fde4d4" stroke="#c2410c" stroke-width="2"/><circle cx="46.0" cy="-169.0" r="3.5" fill="#c2410c"/><circle cx="62.0" cy="-169.0" r="3.5" fill="#c2410c"/><circle cx="78.0" cy="-169.0" r="3.5" fill="#c2410c"/><circle cx="0.0" cy="-123.0" r="13" fill="#f3f5f7" stroke="#c2410c" stroke-width="2.5"/><text x="0.0" y="-116.0" text-anchor="middle" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="600" fill="#c2410c">=</text><text x="-200.0" y="-157.0" text-anchor="middle" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15" font-weight="600" fill="#5b6777" letter-spacing="1.5">ME</text><text x="200.0" y="-157.0" text-anchor="middle" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15" font-weight="600" fill="#5b6777" letter-spacing="1.5">CLIENT</text><text x="213.0" y="-118.0" text-anchor="start" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13" fill="#c2410c" dx="34">eye level</text></g>
<text x="471" y="556" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#1b2430"><tspan font-weight="600">My side:</tspan> my attention, my experience, my time</text>
<text x="1089" y="556" text-anchor="end" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#1b2430"><tspan font-weight="600" fill="#c2410c">Their side:</tspan> the fee that levels the plank</text>
<text x="780" y="588" text-anchor="middle" font-family="Newsreader, Georgia, &quot;Times New Roman&quot;, serif" font-size="19" font-style="italic" fill="#5b6777">No one looks up, no one looks down.</text>
<rect x="60" y="630" width="1080" height="220" rx="12" fill="#ffffff" stroke="#d8dee6"/>
<text x="90" y="672" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15" font-weight="600" fill="#5b6777" letter-spacing="1.5">THE COUNTERWEIGHT</text>
<text x="90" y="726" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="24" fill="#1b2430">fee = <tspan fill="#c2410c">(0.04 × net worth + income)</tspan> ÷ 800</text>
<text x="90" y="760" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#5b6777">for one session  ·  ÷ 80 for a season of ten</text>
<text x="90" y="802" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#1b2430">The fee is a share of a year’s means, not a price.</text>
<text x="90" y="824" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#1b2430">Each person gives the same proportion, so anyone can sit level.</text>
<line x1="690" y1="660" x2="690" y2="820" stroke="#d8dee6"/>
<text x="720" y="672" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="600" fill="#5b6777" letter-spacing="1">EXAMPLES</text><text x="1020" y="672" text-anchor="end" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="600" fill="#5b6777">SESSION</text><text x="1110" y="672" text-anchor="end" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="600" fill="#5b6777">SEASON</text>
<text x="720" y="706" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#1b2430">Net worth $5M</text><text x="720" y="724" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#5b6777">income $250k</text>
<text x="1020" y="716" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="17" fill="#c2410c">$562.50</text><text x="1110" y="716" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="17" fill="#1b2430">$5,625</text>
<text x="720" y="752" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#1b2430">Net worth $100M</text><text x="720" y="770" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#5b6777">income $1M</text>
<text x="1020" y="762" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="17" fill="#c2410c">$6,250</text><text x="1110" y="762" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="17" fill="#1b2430">$62,500</text>
<text x="720" y="798" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#1b2430">Net worth $1B</text><text x="720" y="816" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#5b6777">income $5M</text>
<text x="1020" y="808" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="17" fill="#c2410c">$56,250</text><text x="1110" y="808" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, ui-monospace, Menlo, monospace" font-size="17" fill="#1b2430">$562,500</text>
