<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Communication is only possible between equals</title>
<desc id="d">A teeter-totter as a lever on a fulcrum. Two small scenes show the plank tilted, with the two riders at different heights and no line of sight between them. The main scene shows the plank level: the coach’s side carries attention, experience and time, the client’s side carries a fee of (0.04 × net worth + income) ÷ 800 per session or ÷ 80 per season, and the two meet eye to eye.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono&amp;display=swap');</style>
<rect width="1200" height="900" fill="#f3f5f7"/>
<text x="60" y="78" font-family="Newsreader, Georgia, &quot;Times New Roman&quot;, serif" font-size="42" font-weight="600" fill="#1b2430">Communication is only possible between equals</text>
<text x="60" y="114" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="18" fill="#5b6777">A teeter-totter is a lever on a fulcrum. Two people meet eye to eye only when their weights balance.</text>
<rect x="60" y="160" width="330" height="210" rx="12" fill="#ffffff" stroke="#d8dee6"/>
<text x="82" y="194" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="17" font-weight="600" fill="#1b2430">Too light</text><text x="82" y="216" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#5b6777">a gift, and a debt</text>
